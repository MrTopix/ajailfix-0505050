  reports:
    description: Репорты
    usage: /reports
  ans:
    description: Ответ на репорт
    usage: /ans <id> <answer>
  asms:
    description: Сообщение от админа
    usage: /asms <player> <message>
  lag:
    description: Информация о сервере
    usage: /lag
  serverinfo:
    description: Информация о сервере
    usage: /serverinfo
  entitycount:
    description: Сущности
    usage: /entitycount [world]
  cleardrops:
    description: Очистить дроп
    usage: /cleardrops [radius]
  killmobs:
    description: Убить мобов
    usage: /killmobs [radius]
  broadcasttitle:
    description: Титл всем
    usage: /broadcasttitle <title> | <subtitle>
    aliases: [btitle]
  soundall:
    description: Звук всем
    usage: /soundall <sound>
  actionbarall:
    description: ActionBar всем
    usage: /actionbarall <message>
  entityinfo:
    description: Информация о сущности
    usage: /entityinfo
  chunkinfo:
    description: Информация о чанке
    usage: /chunkinfo
  spy:
    description: Шпион
    usage: /spy
  msgspy:
    description: Шпион за сообщениями
    usage: /msgspy
  locspy:
    description: Шпион за локацией
    usage: /locspy
  sudo:
    description: Судо
    usage: /sudo <player> <command>
  world:
    description: Сменить мир
    usage: /world <worldname>
  randomtp:
    description: Случайный ТП
    usage: /randomtp [world]
  setspawn:
    description: Установить спавн
    usage: /setspawn
  spawn:
    description: Телепорт на спавн
    usage: /spawn [player]
  delhome:
    description: Удалить точку
    usage: /delhome <player>
