name: AJailFix
version: ${project.version}
main: ru.midnight.ajailfix.AJailFixPlugin
api-version: '1.20'
author: Midnight
description: Advanced Jail Fix - Minecraft Administration Plugin

commands:
  ajail:
    description: Система деморгана
    usage: /ajail <player> [time] [reason]
  adminpanel:
    description: Админ-панель
    usage: /adminpanel [player]
    aliases: [apanel]
  invsee:
    description: Открыть инвентарь
    usage: /invsee <player>
  endersee:
    description: Открыть эндер-сундук
    usage: /endersee <player>
  tp:
    description: Телепорт
    usage: /tp <player>
  goto:
    description: Телепорт
    usage: /goto <player>
  gh:
    description: Призвать игрока
    usage: /gh <player>
  gethere:
    description: Призвать игрока
    usage: /gethere <player>
  back:
    description: Вернуться
    usage: /back
  spec:
    description: Наблюдение
    usage: /spec <player>
  gm:
    description: God Mode
    usage: /gm [player]
  fly:
    description: Fly
    usage: /fly [player]
  freeze:
    description: Заморозка
    usage: /freeze <player>
  unfreeze:
    description: Разморозка
    usage: /unfreeze <player>
  heal:
    description: Лечение
    usage: /heal [player]
  feed:
    description: Кормление
    usage: /feed [player]
  speed:
    description: Скорость
    usage: /speed <0-10> [player]
  vanish:
    description: Невидимость
    usage: /vanish [player]
    aliases: [v]
  staffmode:
    description: Staff Mode
    usage: /staffmode
    aliases: [duty]
  whois:
    description: Информация
    usage: /whois <player>
  history:
    description: История
    usage: /history <player>
  ban:
    description: Бан
    usage: /ban <player> [time] [reason]
  unban:
    description: Разбан
    usage: /unban <player>
  mute:
    description: Мут
    usage: /mute <player> [time] [reason]
  unmute:
    description: Размут
    usage: /unmute <player>
  kick:
    description: Кик
    usage: /kick <player> [reason]
  warn:
    description: Варн
    usage: /warn <player> <reason>
  unwarn:
    description: Снять варн
    usage: /unwarn <player> [id]
  tempban:
    description: Временный бан
    usage: /tempban <player> <time> [reason]
  banip:
    description: Бан по IP
    usage: /banip <player/ip> [reason]
  banlist:
    description: Банлист
    usage: /banlist
  mutelist:
    description: Мутлист
    usage: /mutelist
  check:
    description: Проверка
    usage: /check <player> [type] [reason]
  uncheck:
    description: Завершить проверку
    usage: /uncheck <player> [verdict]
  checks:
    description: Список проверок
    usage: /checks
  watch:
    description: Наблюдение
    usage: /watch <player>
  adminlevel:
    description: Уровень админа
    usage: /adminlevel <player> <1-6|remove>
    aliases: [alvl]
  adminlevels:
    description: Система уровней
    usage: /adminlevels on|off|status
    aliases: [alvls]
  note:
    description: Заметка
    usage: /note <player> <text>
  notes:
    description: Заметки
    usage: /notes <player>
  seen:
    description: Последний вход
    usage: /seen <player>
  playtime:
    description: Время игры
    usage: /playtime <player>
  alts:
    description: Альты
    usage: /alts <player>
  case:
    description: Карточка
    usage: /case <player>
  near:
    description: Игроки рядом
    usage: /near [radius]
  ping:
    description: Пинг
    usage: /ping [player]
  stafflist:
    description: Список админов
    usage: /stafflist
  a:
    description: Админ-чат
    usage: /a <message>
  o:
    description: Объявление
    usage: /o <message>
  broadcast:
    description: Объявление
    usage: /broadcast <message>
  clearchat:
    description: Очистить чат
    usage: /clearchat
