    description: Аудит
    usage: /audit [limit]
  mass:
    description: Массовое действие
    usage: /mass <action> <args>
  punish:
    description: Применить шаблон
    usage: /punish <player> <template> [reason]
  adminlog:
    description: Логи админа
    usage: /adminlog
  maintenance:
    description: Техработы
    usage: /maintenance [on|off]
  lockdown:
    description: Полная блокировка
    usage: /lockdown [on|off]
  rollback:
    description: Откат
    usage: /rollback <id>
  web:
    description: Веб-панель
    usage: /web [port]
  reloadajail:
    description: Перезагрузка
    usage: /reloadajail
  helpadmin:
    description: Помощь
    usage: /helpadmin
    aliases: [adminhelp]
  ac:
    description: Античит
    usage: /ac [player]
  anticheat:
    description: Античит
    usage: /anticheat [player]

permissions:
  ajail.*:
    description: Все права AJailFix
    default: op
  ajail.suite.access:
    description: Базовый доступ
    default: op
  ajail.admin:
    description: Полный доступ
    default: op
  ajail.use:
    description: Система деморгана
    default: op
  ajail.set:
    description: Установка точек
    default: op
  ajail.check:
    description: Проверка деморгана
    default: op
  ajail.unjail:
    description: Освобождение
    default: op
  ajail.reload:
    description: Перезагрузка
    default: op
  ajail.asms:
    description: Сообщения от админа
    default: op
  ajail.report:
    description: Репорты (для игроков)
    default: true
  ajail.reports:
    description: Управление репортами
    default: op
  ajail.adminchat:
    description: Админ-чат
    default: op
  ajail.global:
    description: Глобальные объявления
    default: op
  ajail.history:
    description: История наказаний
    default: op
  ajail.ban:
    description: Бан
    default: op
  ajail.unban:
    description: Разбан
    default: op
  ajail.mute:
    description: Мут
    default: op
  ajail.unmute:
    description: Размут
    default: op
  ajail.checks:
    description: Проверки
    default: op
  ajail.teleport:
    description: Телепортация
    default: op
  ajail.invsee:
    description: Просмотр инвентаря
    default: op
  ajail.spec:
    description: Наблюдение
    default: op
  ajail.godmode:
    description: God Mode
    default: op
  ajail.fly:
    description: Fly
    default: op
  ajail.swapgm:
    description: Swap GM
    default: op
  ajail.logs:
    description: Логи
    default: op
  ajail.adminlevels.manage:
    description: Управление уровнями
    default: op
